name: Calender
version: 1.0.0
main: com.enderdevelopment.plugin.Main
author: Kalle
api-version: "1.21"
commands:
  calendar:
    description: Opens the calendar GUI.
    usage: /calendar
    permission: calendar.use
    permission-message: You do not have permission to use this command.
permissions:
  calendar.use:
    description: Allows the player to use the calendar command.
    default: true
  calendar.admin:
    description: Allows the player to use admin commands.
    default: op